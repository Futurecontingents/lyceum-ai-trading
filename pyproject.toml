[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lyceum-ai-trading"
version = "0.2.0"
description = "Autonomous multi-agent options trader that turns AI disagreement into market decisions. Built with Alpaca."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "alpaca-py>=0.44.0",
  "pandas>=2.2",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "streamlit>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
lyceum = "lyceum.__main__:main"
lyceum-connect = "lyceum.connectivity:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lyceum"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

